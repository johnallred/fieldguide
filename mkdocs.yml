site_name: John Allred's Field Guide for Developer Education
site_description: >-
  A training manual for documentation engineering, developer education and
  KnowledgeOps work, whatever your title: 120 concepts, each with a golden path
  and the day-to-day work that needs it.
site_url: https://johnallred.github.io/fieldguide/
repo_url: https://github.com/johnallred/fieldguide
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search

hooks:
  - hooks/summary.py
  - hooks/llms.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc: {permalink: true}
  # anchor_linenums was on, and wrapped every line of every code sample in an
  # empty, focusable link: 11,102 of them across the site, each a tab stop with
  # no name for a keyboard or screen-reader user. scripts/a11y_check.py found
  # them on its first run. Nothing linked to the anchors.
  - pymdownx.highlight
  # Mermaid fences render as diagrams in the browser; see explanation/pipeline.md.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The navigation is deliberately shallow at the top: three ways in, matching
# the three things a reader arrives wanting. Browse by route (paths), look
# something up (coverage), or understand how the guide itself is built.
#
# Concept pages are NOT listed individually here. There are 120 of
# them, and a sidebar with a hundred leaves is a worse index than the
# generated coverage matrix. They are reachable from coverage, from the paths,
# and from each other's prerequisite links.
nav:
  - Start here: index.md
  - Coverage: coverage.md
  - Everything in order: study-plan.md
  - Demonstrated: demonstrated.md
  - Learning paths:
      - paths/index.md
      - The first week: paths/first-week.md
      - A working result in a weekend: paths/prove-it.md
      - The content architect: paths/content-architect.md
      - The documentation engineer: paths/docs-engineer.md
      - The API writer: paths/reference-and-releases.md
      - The knowledge engineer: paths/knowledgeops.md
      - The discoverability lead: paths/answer-engines.md
      - The developer educator: paths/developer-educator.md
      - The lab engineer: paths/lab-engineer.md
      - The writer who builds: paths/writer-who-builds.md
      - The documentation lead: paths/prove-the-outcomes.md
      - The domain newcomer: paths/domain-context.md
  - About this guide:
      - explanation/why-a-registry.md
      - explanation/the-page-contract.md
      - explanation/provenance.md
      - explanation/pipeline.md

not_in_nav: |
  concepts/*.md

exclude_docs: |
  agents/

watch:
  - concepts.yaml
  - src/fieldguide
