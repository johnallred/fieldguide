# The concept registry.
#
# This file is the checklist. It is not a Markdown list of ticks that someone
# updates by hand and forgets: it is the single source of truth for what this
# site covers, and `fieldguide check` fails the build when it and the `docs/`
# tree disagree. A concept with no page is an error. A page with no concept is
# an error. The coverage matrix and the learning paths are generated from here,
# so they cannot drift.
#
# ---------------------------------------------------------------------------
# Fields
# ---------------------------------------------------------------------------
#
#   id            kebab-case, stable, used in URLs and cross-references.
#   name          display name.
#   category      one of the closed set in `categories` below.
#   tier          core      you cannot do this job without it
#                 supporting you will be asked to do it, it is not the centre
#                 context    you need to not be lost in the room
#   difficulty    1 read it  2 practise it  3 build something non-trivial
#   time          honest estimate to working competence, not to familiarity
#   prerequisites concept ids that should come first. Validated as a DAG.
#   demanded_by   which posting asks for it, and how.
#                   provenance: quoted   verbatim from the posting text
#                               derived  the posting requires it, paraphrased
#                               adjacent neither posting names it, and the
#                                        named work is impossible without it
#   status        planned | drafted | complete
#
# ---------------------------------------------------------------------------
# On provenance, and a limitation worth stating plainly
# ---------------------------------------------------------------------------
#
# The Intel Developer Relations and NVIDIA KnowledgeOps postings were read in
# full when this registry was built, and the `quoted` entries are verbatim
# phrases recorded at that time. The posting text itself is no longer on hand,
# so entries marked `derived` are reconstructions of requirements rather than
# quotations, and `adjacent` entries are this author's judgement about what the
# named work actually requires.
#
# Treat `quoted` as evidence and the other two as argument. If the postings are
# available again, the `derived` entries are the ones to re-check first.

categories:
  ia: Information and knowledge architecture
  dac: Docs-as-code toolchain
  qa: Quality automation and documentation CI
  gp: Golden paths and developer onboarding
  ai: AI-ready content and agents
  meas: Measurement and feedback
  edu: Developer education and curriculum
  auto: Automation with Python
  dom: Domain context
  craft: Ways of working

