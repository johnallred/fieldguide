# ---------------------------------------------------------------------------
# Learning paths. Ordered sequences through the concepts above, for readers
# who want a curriculum rather than a reference. Validated: every id must
# exist, and a path may not list a concept before its prerequisites.
# ---------------------------------------------------------------------------

paths:

  - id: first-week
    name: The first week
    audience: Someone who has just taken one of these roles and needs to be useful by Friday.
    summary: The shortest route to shipping a documentation change with confidence.
    concepts:
      - technical-writing
      - docs-as-product
      - docs-as-code
      - markdown
      - git-authoring
      - diataxis
      - static-site-generators
      - mkdocs
      - link-checking
      - documentation-ci

  - id: content-architect
    name: The content architect
    audience: A writer or engineer who owns structure across a growing corpus.
    summary: From a folder of Markdown to a modeled, governed, machine-readable corpus.
    concepts:
      - information-architecture
      - diataxis
      - content-model
      - taxonomy
      - metadata
      - style-guide
      - security-documentation
      - single-sourcing
      - content-lifecycle
      - content-retirement
      - findability
      - playbooks
      - knowledge-architecture

  - id: docs-engineer
    name: The documentation engineer
    audience: Someone building the pipeline rather than writing the pages.
    summary: Every automated gate that stops documentation rotting, in the order worth adding them.
    concepts:
      - docs-as-code
      - git-authoring
      - documentation-ci
      - github-actions
      - link-checking
      - prose-linting
      - custom-linters
      - code-sample-validation
      - doctests
      - doc-test-harness
      - api-reference-generation
      - golden-paths
      - coldstart-testing
      - freshness-monitoring
      - preview-deployments
      - templates-scaffolding
      - guided-workflows
      - release-readiness

  - id: knowledgeops
    name: The KnowledgeOps path
    audience: The NVIDIA posting, more or less exactly.
    summary: Making a corpus answerable by machines, and knowing whether it worked.
    concepts:
      - content-model
      - metadata
      - agent-ready-content
      - llms-txt
      - coding-agents
      - chunking
      - embeddings
      - vector-stores
      - rag
      - grounding
      - ai-assistants
      - retrieval-evaluation
      - output-evaluation
      - mcp
      - agent-skills
      - agentic-workflows
      - ai-answer-quality

  - id: developer-educator
    name: The developer educator
    audience: The Intel posting's curriculum half.
    summary: Taking a developer from a clean environment to a working result, repeatably.
    concepts:
      - docs-as-product
      - instructional-design
      - cognitive-load
      - diataxis
      - tutorial-design
      - golden-paths
      - quickstarts
      - sample-walkthroughs
      - reproducible-environments
      - coldstart-testing
      - learning-paths
      - assessment
      - sample-apps
      - workshops
      - guided-workflows

  - id: writer-who-builds
    name: The writer who builds
    audience: >-
      NVIDIA's own description of the person they want. The half of the job that
      is judgement and collaboration rather than tooling.
    summary: The craft and the working relationships, which no pipeline substitutes for.
    concepts:
      - technical-writing
      - reading-code-to-verify
      - docs-as-product
      - systems-mindset
      - implementation-feedback
      - sme-interviews
      - user-stories
      - release-readiness
      - ai-trust-judgment
      - partner-documentation

  - id: prove-it
    name: Prove it in a weekend
    audience: Someone who needs a portfolio artifact before Monday.
    summary: The shortest path through the concepts that produce something reviewable.
    concepts:
      - docs-as-code
      - diataxis
      - content-model
      - mkdocs
      - documentation-ci
      - link-checking
      - prose-linting
      - code-sample-validation
      - doc-test-harness
      - coldstart-testing
      - llms-txt
      - chunking
      - mcp
      - retrieval-evaluation
      - publishing-in-public

  - id: prove-the-outcomes
    name: Prove the outcomes
    audience: Someone whose documentation work is real and who has been asked, probably in a review, to show what it achieved.
    summary: Write the programs that measure a corpus, then measure the four outcomes the postings actually name.
    concepts:
      - python-for-content
      - content-data-transformation
      - api-integration
      - docs-analytics
      - time-to-first-success
      - support-deflection
      - repeat-questions
      - search-log-analysis
      - ai-answer-quality
      - developer-feedback-loops

  - id: domain-context
    name: Enough domain to not be lost
    audience: Someone interviewing for, or newly inside, a documentation role at a company whose product is graphics, simulation, robotics or AI infrastructure.
    summary: The six domains these postings name, at the depth where you can follow an engineer and know which questions are not yours to answer.
    concepts:
      - gpu-computing
      - inference-serving
      - ai-stack
      - realtime-systems
      - usd-omniverse
      - robotics-sim
