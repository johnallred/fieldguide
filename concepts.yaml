# ---------------------------------------------------------------------------
# Learning paths. Ordered sequences through the concepts above, for readers
# who want a curriculum rather than a reference. Validated: every id must
# exist, and a path may not list a concept before its prerequisites.
# ---------------------------------------------------------------------------

paths:

  - id: first-week
    group: start
    name: The first week
    audience: Someone who has just started in this kind of work and needs to be useful by Friday.
    summary: The shortest route to shipping a documentation change with confidence.
    concepts:
      - technical-writing
      - docs-as-product
      - docs-as-code
      - markdown
      - git-authoring
      - diataxis
      - static-site-generators
      - mkdocs
      - link-checking
      - documentation-ci

  - id: prove-it
    group: start
    name: A working result in a weekend
    audience: Someone who needs to ship something their team can review by Monday.
    summary: The shortest path through the concepts that produce something reviewable.
    concepts:
      - docs-as-code
      - diataxis
      - content-model
      - mkdocs
      - documentation-ci
      - link-checking
      - prose-linting
      - code-sample-validation
      - doc-test-harness
      - coldstart-testing
      - llms-txt
      - chunking
      - mcp
      - retrieval-evaluation
      - publishing-in-public

  - id: content-architect
    group: role
    name: The content architect
    audience: A writer or engineer who owns structure across a growing corpus.
    summary: From a folder of Markdown to a modelled, governed, machine-readable corpus.
    concepts:
      - information-architecture
      - diataxis
      - content-model
      - taxonomy
      - metadata
      - style-guide
      - terminology-drift
      - security-documentation
      - single-sourcing
      - localization
      - multi-platform-parity
      - content-lifecycle
      - content-retirement
      - content-migration
      - findability
      - playbooks
      - knowledge-architecture

  - id: docs-engineer
    group: role
    name: The documentation engineer
    audience: Someone building the pipeline rather than writing the pages.
    summary: Every automated gate that stops documentation rotting, in the order worth adding them.
    concepts:
      - docs-as-code
      - git-authoring
      - docs-review
      - documentation-ci
      - github-actions
      - link-checking
      - prose-linting
      - custom-linters
      - accessibility
      - code-sample-validation
      - diagrams-as-code
      - doc-test-harness
      - golden-paths
      - coldstart-testing
      - freshness-monitoring
      - preview-deployments
      - templates-scaffolding
      - guided-workflows

  - id: reference-and-releases
    group: role
    name: Reference and releases
    audience: Someone who owns the API reference and the versioned docs for a product that ships releases.
    summary: Reference generated from the source, checked against it, and versioned with each release.
    concepts:
      - api-reference-generation
      - openapi
      - restructuredtext
      - sphinx
      - doctests
      - versioning
      - release-readiness
      - release-notes

  - id: knowledgeops
    group: role
    name: The KnowledgeOps path
    audience: Someone responsible for making a knowledge base usable by AI assistants and agents.
    summary: Making a corpus answerable by machines, and knowing whether it worked.
    concepts:
      - content-model
      - metadata
      - agent-ready-content
      - llms-txt
      - coding-agents
      - chunking
      - embeddings
      - vector-stores
      - rag
      - grounding
      - ai-assistants
      - retrieval-evaluation
      - output-evaluation
      - hallucination-guardrails
      - mcp
      - agent-skills
      - agentic-workflows
      - ai-answer-quality

  - id: answer-engines
    group: role
    name: Found by search and answer engines
    audience: Someone responsible for whether people, search engines and AI answer engines can find the documentation at all.
    summary: From metadata to being cited, making a public corpus discoverable and quotable.
    concepts:
      - metadata
      - findability
      - structured-data
      - seo-for-docs
      - crawlability
      - agent-ready-content
      - llms-txt
      - geo

  - id: developer-educator
    group: role
    name: The developer educator
    audience: Someone who owns developer onboarding, tutorials and curriculum.
    summary: Taking a developer from a clean environment to a working result, repeatably.
    concepts:
      - docs-as-product
      - learning-science
      - learner-task-analysis
      - instructional-design
      - cognitive-load
      - diataxis
      - tutorial-design
      - screencasts
      - golden-paths
      - quickstarts
      - sample-walkthroughs
      - learning-paths
      - lms-administration
      - learning-content-standards
      - assessment
      - sample-apps
      - demo-design
      - workshops
      - field-enablement

  - id: lab-engineer
    group: role
    name: The lab engineer
    audience: Someone who builds, tests and publishes hands-on labs that run in real cloud accounts.
    summary: Taking a lab from a working draft to one that is tested nightly, published on evidence, safe for learners and portable.
    concepts:
      - code-sample-validation
      - documentation-ci
      - reproducible-environments
      - coldstart-testing
      - ephemeral-environments
      - lab-publishing
      - learner-sandbox-guardrails
      - multi-platform-parity
      - isolated-region-labs

  - id: writer-who-builds
    group: role
    name: The writer who builds
    audience: >-
      A writer who also builds tooling, and needs the half of the work that is
      judgement and collaboration rather than tooling.
    summary: The craft and the working relationships, which no pipeline substitutes for.
    concepts:
      - technical-writing
      - reading-code-to-verify
      - docs-as-product
      - systems-mindset
      - implementation-feedback
      - sme-interviews
      - docs-review
      - working-with-engineers
      - developer-advocacy
      - user-stories
      - release-readiness
      - prompting
      - ai-trust-judgment
      - llm-content-lifecycle
      - partner-documentation

  - id: prove-the-outcomes
    group: later
    name: Prove the outcomes
    audience: Someone whose documentation work is real and who has been asked, probably in a review, to show what it achieved.
    summary: Write the programs that measure a corpus, then measure the four outcomes that matter most.
    concepts:
      - python-for-content
      - content-data-transformation
      - api-integration
      - docs-analytics
      - time-to-first-success
      - support-deflection
      - repeat-questions
      - search-log-analysis
      - ai-answer-quality
      - developer-feedback-loops
      - docs-prioritization

  - id: domain-context
    group: context
    name: Enough domain to not be lost
    audience: Someone doing documentation work at a company whose product is graphics, simulation, robotics or AI infrastructure.
    summary: Six technical domains, at the depth where you can follow an engineer and know which questions are not yours to answer.
    concepts:
      - gpu-computing
      - inference-serving
      - ai-stack
      - realtime-systems
      - usd-omniverse
      - robotics-sim

# Concepts on no learning path, each with the reason a reader is told. Every
# concept is on a path or listed here, and a core concept is never listed
# here: tests/test_registry.py holds both, so a concept cannot drop off every
# path without someone writing down why.
off_path:
  mdx: >-
    An alternative to the Markdown the paths teach, met when a site is built on
    Docusaurus or another React-based generator.
  docusaurus: >-
    An alternative generator. The paths teach MkDocs; read this when the site
    you inherit is built on Docusaurus.
  antora: >-
    An alternative generator for multi-repository AsciiDoc sites. Read it when
    the site you inherit is built on Antora.
